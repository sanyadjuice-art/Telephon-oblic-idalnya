<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Облік харчування особового складу</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="auth-container">
    <h2>Вхід у систему</h2>
    <p>Введіть номер телефону для отримання SMS</p>
    <input type="tel" id="phone-number" placeholder="+380XXXXXXXXX" value="+380">
    <div id="recaptcha-container"></div>
    <button id="send-code-btn">Отримати SMS-код</button>
  </div>

  <div id="verification-container" style="display: none;">
    <h2>Підтвердження</h2>
    <input type="text" id="verification-code" placeholder="Код з SMS">
    <button id="verify-code-btn">Підтвердити</button>
  </div>

  <!-- Firebase App & Auth SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Основний скрипт логіки -->
  <script src="app.js"></script>
</body>
</html>
