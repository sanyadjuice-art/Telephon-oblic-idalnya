<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Облік харчування особового складу</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head> 
<body>

  <!-- МОДАЛЬНЕ ВІКНО АВТОРИЗАЦІЇ ТА ПРОФІЛЬ -->
  <div id="authModal" class="modal" style="display: flex;">
  <div class="modal-content">
    
    <!-- Крок 1: Вхід або Реєстрація -->
    <div id="stepAuth">
      <h3>🔐 Вхід у систему</h3>
      <input type="email" id="authEmail" placeholder="Електронна пошта (email)" class="form-input" style="margin-bottom: 10px; width: 100%;">
      <input type="password" id="authPassword" placeholder="Пароль (від 6 символів)" class="form-input" style="margin-bottom: 15px; width: 100%;">
      
      <div style="display: flex; gap: 10px;">
        <button onclick="loginUser()" class="btn btn-primary" style="flex: 1;">Увійти</button>
        <button onclick="registerUser()" class="btn btn-secondary" style="flex: 1;">Зареєструватися</button>
      </div>
    </div>

    <!-- Крок 2: Заповнення профілю після реєстрації -->
    <div id="stepProfile" style="display: none;">
      <h3>👤 Профіль користувача</h3>
      <input type="text" id="userRank" placeholder="Військове звання" class="form-input" style="margin-bottom: 10px; width: 100%;">
      <input type="text" id="userFullName" placeholder="Прізвище та Ініціали *" class="form-input" style="margin-bottom: 10px; width: 100%;">
      <input type="text" id="userUnit" placeholder="Підрозділ / Рота" class="form-input" style="margin-bottom: 15px; width: 100%;">
      <button onclick="saveProfile()" class="btn btn-primary" style="width: 100%;">Зберегти та увійти</button>
    </div>

  </div>
</div>

  <!-- ОСНОВНИЙ КОНТЕНТ ДОДАТКУ -->
  <div id="appContent" style="display: none;">
    
    <header class="header-container">
      <div class="trident">🔱</div>
      <h2>Облік харчування особового складу</h2>
      <div class="user-info-header" style="margin-top: 10px; justify-content: center;">
        <span>Користувач: <strong id="headerUserName">-</strong></span>
        <button class="btn-logout" onclick="logout()">Вийти</button>
      </div>
    </header>

    <!-- Панель користувачів онлайн -->
    <div class="card">
      <div class="collapsible-header" onclick="toggleOnlinePanel()">
        <span>Користувачі онлайн (<span id="onlineCount" class="meal-count">0</span>)</span>
        <span id="onlineToggleIcon" class="icon">➖</span>
      </div>
      <div id="onlineUsersList" style="margin-top: 8px;"></div>
    </div>

    <!-- Панель керування та фільтрів -->
    <div class="card">
      <label for="reportDate">Дата звіту:</label>
      <input type="date" id="reportDate" onchange="onDateChange()">
      
      <label for="unitFilter">Фільтр підрозділу:</label>
      <select id="unitFilter" onchange="App.renderTable()">
        <option value="ALL">Всі підрозділи</option>
      </select>

      <button class="btn-search" onclick="promptSearch()">Пошук 🔍</button>
      <button id="resetSearchBtn" class="btn-reset" onclick="resetSearch()" style="display: none;">Скинути пошук ❌</button>
    </div>

    <!-- Форма додавання / редагування -->
    <div class="card add-box">
      <div class="collapsible-header" onclick="toggleForm()">
        <span id="formTitle">➕ Додати нового військовослужбовця</span>
        <span id="toggleIcon" class="icon">➕</span>
      </div>

      <div id="formContent" class="form-content" style="display: none;">
        <input type="hidden" id="editIndex" value="-1">
        <input type="text" id="newRank" list="ranksList" placeholder="Звання">
        <input type="text" id="newName" placeholder="Прізвище та ініціали (*)">
        <input type="text" id="newUnit" list="unitsList" placeholder="Підрозділ">
        <button id="saveBtn" class="btn" onclick="savePerson()">Додати до списку</button>
        <button id="cancelBtn" class="btn btn-secondary" onclick="resetForm()" style="display: none;">Скасувати</button>
      </div>
    </div>

    <!-- Основна таблиця обліку -->
    <div class="card" style="padding: 6px;">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>№</th>
              <th>Звання</th>
              <th>ПІБ</th>
              <th>Підрозділ</th>
              <th>Сніданок (<span id="totalBreakfast">0</span>)</th>
              <th>Обід (<span id="totalLunch">0</span>)</th>
              <th>Вечеря (<span id="totalDinner">0</span>)</th>
              <th>Дії</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Панель імпорту/експорту -->
    <div class="file-controls">
      <button class="btn btn-file" onclick="exportToExcel()">📊 Експорт в Excel</button>
    </div>

  </div>

  <datalist id="ranksList"></datalist>
  <datalist id="unitsList"></datalist>
  <datalist id="authRanksList"></datalist>
  <datalist id="authUnitsList"></datalist>

  <script type="module" src="app.js"></script>
</body>
</html>
